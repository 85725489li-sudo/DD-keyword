services:
  - type: web
    name: dd-keyword-tool
    runtime: docker
    plan: starter         # 付费套餐才有持久磁盘，免费版 SQLite 重启会丢失
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DD_EMAIL
        sync: false       # 在 Render 控制台手动填写
      - key: DD_PASSWORD
        sync: false
      - key: DD_COOKIES
        sync: false       # 可选：粘贴导出的 Cookie JSON
      - key: HEADLESS
        value: "1"
    disk:
      name: dd-data
      mountPath: /data
      sizeGB: 1
